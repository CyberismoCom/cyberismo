name: Binary

# Builds the experimental `cyberismo-dev` single binary (tools/cli-bin) and
# uploads it as a workflow artifact per platform. Nothing is released; the
# artifacts are what tools/cli-bin/install.sh downloads.

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: binary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: macos-latest, target: darwin-arm64 }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: pnpm install --ignore-scripts
      - name: Resolve clingo submodule SHA
        id: clingo-sha
        shell: bash
        run: echo "sha=$(git -C tools/node-clingo/external/clingo rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # Same keys as the build-and-test workflows, so the caches are shared.
      - name: Cache node-clingo binding
        id: cache-binding
        uses: actions/cache@v4
        with:
          path: tools/node-clingo/build/Release
          key: binding-${{ runner.os }}-${{ runner.arch }}-node${{ vars.NODE_VERSION }}-${{ steps.clingo-sha.outputs.sha }}-${{ hashFiles('tools/node-clingo/src/**', 'tools/node-clingo/patches/**', 'tools/node-clingo/binding.gyp', 'tools/node-clingo/package.json') }}
      - name: Cache clingo static libs
        if: steps.cache-binding.outputs.cache-hit != 'true'
        id: cache-clingo
        uses: actions/cache@v4
        with:
          path: tools/node-clingo/external/clingo/build/lib
          key: clingo-libs-${{ runner.os }}-${{ runner.arch }}-node${{ vars.NODE_VERSION }}-${{ steps.clingo-sha.outputs.sha }}-${{ hashFiles('tools/node-clingo/scripts/build-clingo.cmake', 'tools/node-clingo/patches/**', 'tools/node-clingo/binding.gyp') }}
      - name: Build clingo static libs
        if: steps.cache-binding.outputs.cache-hit != 'true' && steps.cache-clingo.outputs.cache-hit != 'true'
        run: pnpm --filter @cyberismo/node-clingo run build:clingo
      - name: Build node-clingo native binding
        if: steps.cache-binding.outputs.cache-hit != 'true'
        run: pnpm --filter @cyberismo/node-clingo run build:binding
      - run: pnpm build
      - name: Build binary
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          label=$(printf '%s' "$REF_NAME" | tr -c 'A-Za-z0-9._-' '-')
          export CYBERISMO_BUILD_ID="${label}-${GITHUB_SHA:0:9}"
          pnpm --filter @cyberismo/cli-bin run build:bin
      # From a copy outside the checkout, so a path baked in at build time
      # that only exists here still fails.
      - name: Smoke test
        shell: bash
        run: |
          cp tools/cli-bin/dist-bin/cyberismo-dev "$RUNNER_TEMP/cyberismo-dev"
          cp -r docs "$RUNNER_TEMP/docs"
          mv tools "$RUNNER_TEMP/tools-hidden"
          cd "$RUNNER_TEMP/docs"
          ../cyberismo-dev --version
          ../cyberismo-dev validate
          ../cyberismo-dev export site "$RUNNER_TEMP/site"
          test -f "$RUNNER_TEMP/site/index.html"
          mv "$RUNNER_TEMP/tools-hidden" "$GITHUB_WORKSPACE/tools"
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: cyberismo-dev-${{ matrix.target }}
          path: tools/cli-bin/dist-bin/cyberismo-dev
          if-no-files-found: error
          retention-days: 30
