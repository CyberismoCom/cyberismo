# Verifies that all npm/pnpm dependencies carry an allowed license
# (policy in scripts/license-policy.json), and that every file in the repo
# has copyright and license information per the REUSE spec (REUSE.toml).

name: License check

on:
  pull_request:

jobs:
  license-check:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ["${{ vars.NODE_VERSION }}"]

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
          registry-url: "https://npm.pkg.github.com"
          scope: "@cyberismo"
      - name: Install dependencies
        run: pnpm install --ignore-scripts
      - name: Check dependency licenses
        run: pnpm check-licenses

  reuse:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - name: Check file license headers (REUSE)
        run: pipx run reuse==6.2.0 lint
      - name: Hint
        if: failure()
        run: echo "::error::REUSE lint failed. Add the two-line SPDX header or annotate the file in REUSE.toml; see AGENTS.md (Code style)."
