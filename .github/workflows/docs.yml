name: Docs

# Builds docs.cyberismo.com. The site has the core `docs` project and the
# projects of the open content modules, exported to one static site. Each
# project is under /projects/<prefix>/, and `docs` is the default project.

on:
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
    inputs:
      deploy:
        type: boolean
        description: 'Deploy to Pages after building'
        default: true
      modules:
        type: string
        description: 'Modules to include, space separated, as <repository>[@<tag or branch>]. Empty uses the list in the workflow. "none" includes no modules. For a preview, clear deploy.'
        default: ''
  # A module release can request a new build of the site. The module
  # repository sends the event with a token that can write to this repository:
  #   gh api repos/CyberismoCom/cyberismo/dispatches -f event_type=module-released
  repository_dispatch:
    types: [module-released]
  workflow_call:
    inputs:
      deploy:
        type: boolean
        default: false

permissions:
  contents: read

env:
  CLI_VERSION: 1.3.1
  # The module repositories in the site, space separated, as
  # <repository>[@<tag or branch>]. Without a tag or a branch, the build uses
  # the latest version tag (v*) of the module, which is the version that users
  # import.
  # Add a module only when a release of it hides its test content in exports
  # (the label `test-content`). Before that, the site shows its test fixtures.
  # The open modules: module-base, module-isms-essentials,
  # module-secure-development-essentials, and module-eu-cra.
  MODULES: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Select the core revision
        id: core
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # A module release rebuilds the site from the latest core release,
          # so that the application documentation matches the released
          # application. The other events use the revision that triggered them.
          if [ "$EVENT_NAME" = repository_dispatch ]; then
            ref=$(git ls-remote --tags --refs --sort=-v:refname \
              "https://github.com/${GITHUB_REPOSITORY}.git" 'cyberismo-*' \
              | head -n 1 | sed 's|.*refs/tags/||')
            echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.core.outputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION }}

      - name: Install Cyberismo CLI
        run: npm install -g "@cyberismo/cli@${CLI_VERSION}"

      - name: Collect the projects
        env:
          INPUT_MODULES: ${{ inputs.modules }}
        run: |
          mkdir -p build/projects
          cp -R docs build/projects/docs
          modules="${INPUT_MODULES:-$MODULES}"
          if [ "$modules" = none ]; then
            modules=''
          fi
          for entry in $modules; do
            repository="${entry%%@*}"
            ref="${entry#"$repository"}"
            ref="${ref#@}"
            url="https://github.com/CyberismoCom/${repository}.git"
            if [ -z "$ref" ]; then
              ref=$(git ls-remote --tags --refs --sort=-v:refname "$url" 'v*' \
                | head -n 1 | sed 's|.*refs/tags/||')
            fi
            if [ -z "$ref" ]; then
              echo "::error::${repository} has no version tag"
              exit 1
            fi
            echo "::notice::${repository} at ${ref}"
            git -c advice.detachedHead=false clone --quiet --depth 1 \
              --branch "$ref" "$url" "build/projects/${repository}"
            rm -rf "build/projects/${repository}/.git"
          done

      - name: Migrate and validate the projects
        run: |
          # The CLI opens only projects at its own schema version. A module
          # release can be at an older version, so the build migrates its copy.
          for project in build/projects/*/; do
            cyberismo migrate -p "$project"
            cyberismo validate -p "$project"
          done

      - name: Build site
        run: |
          cyberismo export site build/site -p build/projects --default-project docs
          touch build/site/.nojekyll
          # GitHub Pages serves 404.html for any path it has no file for.
          # Making it the SPA shell lets the client router resolve deep links
          # such as /projects/<prefix>/cards/<key> instead of falling back to
          # the home card.
          cp build/site/index.html build/site/404.html

      - uses: actions/upload-artifact@v4
        with:
          name: rendered-site
          path: build/site
          retention-days: 7

  deploy:
    needs: build
    if: inputs.deploy || github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rendered-site
          path: build/site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

      - id: deployment
        uses: actions/deploy-pages@v4
